[package]
name = "skill_helper"
version = "1.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
log = "0.4"
ureq = { version = "3.2.0", features = ["json"] }
